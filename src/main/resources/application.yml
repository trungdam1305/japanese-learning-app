spring:
  application:
    name: individual
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/japanese_learning}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-local-secret-change-me-before-production-please-1234567890}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}
  seed:
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    admin-email: ${SEED_ADMIN_EMAIL:admin@jlearn.local}

logging:
  level:
    individual: DEBUG
